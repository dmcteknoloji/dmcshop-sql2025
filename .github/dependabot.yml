# Bagimlilik guvenligi: NuGet denetimi yalniz build sirasinda calisiyor, yani
# kimse push etmezse yeni acik sessizce birikiyor. Bu dosya kuruldugu gun
# projede iki yuksek onemli acik oldugu ortaya cikti (Microsoft.OpenApi ve
# SSH.NET), ikisi de aylardir oradaydi.
version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "bagimlilik"
    groups:
      # Yama surumleri tek PR'da gelsin, haftada bes ayri PR olmasin.
      yamalar:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
