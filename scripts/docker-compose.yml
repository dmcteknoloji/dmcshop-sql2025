name: dmcshop

services:
  mssql:
    # Etiket bilerek sabit. 2025-latest her dagitimda sessizce yeni CU indiriyordu:
    # 3 Eylul 2026 kurulumunda sunucu CU8'e cikti, kimse fark etmedi.
    # Yukseltme bilerek yapilir, bu satir elle degistirilir.
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    container_name: dmcshop-mssql
    restart: unless-stopped
    ports:
      # YALNIZ localhost. SA parolasinin varsayilani PUBLIC depoda yazili;
      # 1433 tum arayuzlere baglanirsa NSG'de tek bir kural degisikligi
      # veritabanini internete acar. Uygulama ayni Docker aginda oldugu icin
      # bu kisitlama ise yaramiyor, yalnizca disaridan erisimi kapatiyor.
      # Hata ayiklamak icin: ssh -L 1433:localhost:1433 <vm>
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Varsayilan YOK. Parola scripts/.env icinde durur ve
      # scripts/sa-password.sh tarafindan bir kez rastgele uretilir.
      # Tanimsizsa compose burada durur, sessizce zayif parolaya dusmez.
      MSSQL_SA_PASSWORD: "${DMCSHOP_SA_PASSWORD:?scripts/setup.sh calistirin veya DMCSHOP_SA_PASSWORD verin}"
      MSSQL_COLLATION: "Turkish_100_CI_AS_SC_UTF8"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost
          -U sa -P "$$MSSQL_SA_PASSWORD"
          -Q "SELECT 1" -b -t 5
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: dmcshop-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # Varsayilan 5 dakika: model bellekten atiliyor ve gunun ilk ziyaretcisi
      # 18 saniye bekliyordu (olculdu). -1 modeli bellekte tutar.
      # Bedeli surekli ayrilmis ~2,5 GB; bu yuzden SQL Server'a da tavan
      # konuldu, bkz. sql/09-server-memory.sql.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ollama list >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  mssql-data:
  ollama-models:
