#cloud-config
# ============================================================================
# cloud-init.yaml
# DMCShop demo VM'sini hazırlar:
#   - Docker + compose plugin
#   - .NET 10 SDK
#   - sqlcmd (mssql-tools18)
#   - git + jq + rsync
#   - UFW ile temel firewall (22, 80, 443)
# Repo deploy.sh tarafından rsync ile gönderilir; bootstrap ayrı adım.
# ============================================================================

package_update: true
package_upgrade: false   # ilk boot süresini uzatmamak için

packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - apt-transport-https
  - git
  - jq
  - rsync
  - ufw
  - unzip

write_files:
  - path: /etc/systemd/system/dmcshop-web.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DMCShop Blazor Web
      After=network.target docker.service
      Requires=docker.service

      [Service]
      Type=simple
      User=dmcshop
      WorkingDirectory=/home/dmcshop/dmcshop-publish
      Environment=ASPNETCORE_ENVIRONMENT=Production
      Environment=ASPNETCORE_URLS=http://0.0.0.0:80
      Environment=DOTNET_ROOT=/usr/lib/dotnet
      ExecStart=/usr/bin/dotnet DMCShop.Web.dll
      Restart=on-failure
      RestartSec=10
      AmbientCapabilities=CAP_NET_BIND_SERVICE

      [Install]
      WantedBy=multi-user.target

runcmd:
  # 1) Docker official repo + engine
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker dmcshop

  # 2) Microsoft repos: .NET 10 SDK + mssql-tools18
  - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod $(. /etc/os-release && echo "$VERSION_CODENAME") main" > /etc/apt/sources.list.d/microsoft-prod.list
  - apt-get update -y
  - DEBIAN_FRONTEND=noninteractive ACCEPT_EULA=Y apt-get install -y dotnet-sdk-10.0 mssql-tools18 unixodbc-dev
  - ln -sf /opt/mssql-tools18/bin/sqlcmd /usr/local/bin/sqlcmd

  # 3) UFW basic
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - echo "y" | ufw enable

  # 4) Working dirs
  - mkdir -p /home/dmcshop/dmcshop-sql2025
  - chown -R dmcshop:dmcshop /home/dmcshop

  # 5) Cloud-init bitti işareti — deploy.sh bunu bekler
  - touch /var/lib/dmcshop-ready

final_message: "DMCShop VM hazır. Deploy script'inden rsync + bootstrap çalıştırılabilir."
