<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="DMCShop — SQL Server 2025 graph + vector reference application">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#0B0E11"/>
            <stop offset="60%"  stop-color="#161B22"/>
            <stop offset="100%" stop-color="#1C232C"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#A4262C"/>
            <stop offset="100%" stop-color="#DD4853"/>
        </linearGradient>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1F262E" stroke-width="1"/>
        </pattern>
    </defs>

    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)" opacity="0.55"/>

    <rect x="60" y="80" width="6" height="200" fill="url(#accent)"/>

    <text x="92" y="124" font-family="'Inter', 'Segoe UI', sans-serif"
          font-size="14" font-weight="600" letter-spacing="3"
          fill="#DD4853" text-rendering="geometricPrecision">DMC BİLGİ TEKNOLOJİLERİ</text>

    <text x="92" y="190" font-family="'Inter', 'Segoe UI', sans-serif"
          font-size="60" font-weight="700" letter-spacing="-1.5"
          fill="#ECEFF4" text-rendering="geometricPrecision">DMCShop</text>

    <text x="92" y="230" font-family="'Inter', 'Segoe UI', sans-serif"
          font-size="20" font-weight="500" letter-spacing="-0.3"
          fill="#9BA4B0" text-rendering="geometricPrecision">
        SQL Server 2025 vector ve graf üzerine kurulu açık kaynak referans uygulama
    </text>

    <g font-family="'JetBrains Mono', 'Cascadia Code', monospace" font-size="13" fill="#6B7480">
        <text x="92"  y="290">VECTOR_SEARCH</text>
        <text x="240" y="290" fill="#4B5360">·</text>
        <text x="260" y="290">DiskANN</text>
        <text x="340" y="290" fill="#4B5360">·</text>
        <text x="360" y="290">GRAPH MATCH</text>
        <text x="480" y="290" fill="#4B5360">·</text>
        <text x="500" y="290">SHORTEST_PATH</text>
        <text x="630" y="290" fill="#4B5360">·</text>
        <text x="650" y="290">AI_GENERATE_EMBEDDINGS</text>
    </g>

    <g font-family="'JetBrains Mono', 'Cascadia Code', monospace" font-size="12" fill="#4B5360">
        <text x="92" y="320">50.120 ürün</text>
        <text x="220" y="320">10.050 müşteri</text>
        <text x="360" y="320">100.400 sipariş</text>
        <text x="510" y="320">451.202 sipariş satırı</text>
        <text x="680" y="320">100 kategori</text>
    </g>

    <g transform="translate(900,80)" font-family="'Inter', 'Segoe UI', sans-serif">
        <rect width="220" height="200" rx="12" fill="#1C232C" stroke="#2A323D" stroke-width="1"/>
        <text x="20" y="36" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9BA4B0">STACK</text>
        <line x1="20" y1="46" x2="200" y2="46" stroke="#2A323D"/>
        <g font-size="13" fill="#ECEFF4">
            <text x="20" y="74">SQL Server 2025 CU8</text>
            <text x="20" y="100">.NET 10 · Blazor Server</text>
            <text x="20" y="126">EF Core 10</text>
            <text x="20" y="152">Ollama nomic-embed-text</text>
            <text x="20" y="178">Ollama qwen2.5:3b-instruct</text>
        </g>
    </g>
</svg>
